name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install native leveldb (for end-to-end tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libleveldb-dev

      - name: Restore
        run: dotnet restore IronLeveldb.sln

      - name: Build
        run: dotnet build IronLeveldb.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test IronLeveldb.Test/IronLeveldb.Test.csproj --configuration Release --no-build --verbosity normal
